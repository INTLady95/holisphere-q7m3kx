<style>
  :root { --accent:#d4b06a; --sand:#f3ecdf; --ink:#1d2a26; --sea:#1f5041; --line:rgba(29,42,38,.16); }
  body { font-family:"Inter", sans-serif; font-weight:300; }
  .brand { display:flex; align-items:center; gap:10px; } .brand img { width:30px; height:30px; filter:drop-shadow(0 2px 8px rgba(0,0,0,.35)); }

  /* ---- top bar in the world: brand + dropdown menus + mode buttons ---- */

  .dd { position:relative; } .dd > button { color:#fff; background:var(--glass2); border:1px solid rgba(212,176,106,.35); backdrop-filter:blur(8px); padding:8px 14px; border-radius:999px; cursor:pointer; font:inherit; font-size:13px; backdrop-filter:blur(6px); }

  .dd:hover ul, .dd:focus-within ul, .dd.open ul { display:block; } .dd.closed ul { display:none !important; }
  .dd li button { width:100%; text-align:left; color:#fff; background:none; border:0; padding:9px 12px; border-radius:9px; cursor:pointer; font:inherit; font-size:13.5px; display:flex; justify-content:space-between; gap:12px; }
  .dd li button:hover { background:rgba(212,176,106,.16); } .dd li button small { opacity:.6; font-size:11px; }
  .modes { display:flex; gap:8px; } .modes button { color:#fff; background:var(--glass2); border:1px solid rgba(212,176,106,.35); padding:8px 14px; border-radius:999px; cursor:pointer; font:inherit; font-size:13px; backdrop-filter:blur(8px); }
  .modes button.primary { background:var(--gold); color:var(--g1); border-color:var(--gold); }

  #video .over { position:absolute; inset:0; display:flex; flex-direction:column; justify-content:flex-end; padding:0 clamp(20px,6vw,90px) clamp(60px,9vh,110px); background:linear-gradient(to top, rgba(15,47,37,.75), transparent 55%); }
  #video p.k { font-size:12px; letter-spacing:.2em; text-transform:uppercase; color:var(--accent); margin-bottom:14px; }
  #video h1 { font-family:"Cormorant Garamond", serif; font-size:clamp(48px,8vw,124px); line-height:.9; font-weight:400; max-width:14ch; }
  #video h1 em { font-style:italic; color:var(--accent); }
  #video p.s { margin-top:18px; font-size:15px; opacity:.9; max-width:46ch; }

  /* ---- the ordinary site: full overlay or left half ---- */
  #site { background:var(--sand); color:var(--ink); left:0; top:0; bottom:0; right:0; transition:opacity .5s; }
  body.site-split #site { right:50%; box-shadow:8px 0 30px rgba(15,47,37,.3); }

  body.site-split #deg { left:auto; }
  body.site-split #card { left:auto; right:18px; width:min(300px, 46vw); }
  .site-header { min-height:64px; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; padding:10px clamp(16px,3vw,40px); border-bottom:1px solid var(--line); position:sticky; top:0; background:color-mix(in srgb, var(--sand) 94%, transparent); backdrop-filter:blur(18px); z-index:3; }
  .site-header .brand b { color:var(--ink); } .site-header .brand img { filter:none; content:url("assets/logo-ring-green.svg"); }
  .site-header .dd > button { color:var(--ink); background:none; border:1px solid var(--line); }
  .site-header .dd ul { background:var(--sand); border-color:var(--line); } .site-header .dd li button { color:var(--ink); } .site-header .dd li button:hover { background:rgba(29,42,38,.07); }
  .site-header .modes button { color:var(--ink); background:none; border:1px solid var(--line); } .site-header .modes button.primary { background:var(--ink); color:#fff; border-color:var(--ink); }
  #langpick { position:fixed; inset:0; z-index:13; display:none; align-items:center; justify-content:center; background:rgba(12,40,32,.55); backdrop-filter:blur(10px); }
  #langpick.show { display:flex; }
  .lp-card { text-align:center; background:rgba(16,50,40,.6); border:1px solid rgba(212,176,106,.45); border-radius:24px; padding:34px 40px 30px; box-shadow:0 20px 60px rgba(0,0,0,.35); }
  .lp-card img { width:56px; height:56px; margin-bottom:10px; } .lp-card h2 { font-family:"Inter", sans-serif; font-weight:400; font-size:16px; letter-spacing:.42em; color:#fff; margin-bottom:6px; }

  .lp-row button:hover { background:var(--gold); color:var(--g1); }
  #minimap { position:fixed; z-index:5; right:18px; bottom:64px; width:190px; padding:8px 10px 6px; border-radius:16px; background:var(--glass2); border:1px solid rgba(212,176,106,.3); backdrop-filter:blur(10px); opacity:.9; }
  #minimap svg { width:100%; height:auto; display:block; overflow:visible; }
  #minimap .isl { fill:rgba(212,176,106,.12); stroke:rgba(212,176,106,.55); stroke-width:1; }
  #minimap .lbl { font-size:8px; letter-spacing:.14em; text-transform:uppercase; fill:rgba(255,255,255,.7); text-anchor:middle; }
  #minimap .pt circle { fill:rgba(255,255,255,.55); cursor:pointer; transition:fill .2s; } #minimap .pt:hover circle { fill:var(--gold2); } #minimap .pt.on circle { fill:var(--gold); }
  #minimap .you { fill:var(--gold); stroke:#fff; stroke-width:1.2; pointer-events:none; transition:cx .6s, cy .6s; }
  #minimap .you2 { fill:none; stroke:var(--gold2); stroke-width:1.2; pointer-events:none; transition:cx .6s, cy .6s; animation:mmpulse 1.8s ease-out infinite; }
  @keyframes mmpulse { 0% { r:4; opacity:.9; } 100% { r:11; opacity:0; } }
  #mm-cap { display:block; font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--gold2); text-align:center; margin-top:4px; }
  body.site-split #minimap { display:none; } body.flight #minimap { opacity:.35; }
  #deg { bottom:190px; }
  #onb-replay { width:36px; padding:0 !important; font-weight:500; }

  #onb.show { display:block; }

  #onb .onb-card { position:absolute; background:rgba(16,50,40,.55); border:1px solid rgba(212,176,106,.45); border-radius:18px; padding:18px 20px 14px; backdrop-filter:blur(16px); color:#fff; transition:all .45s cubic-bezier(.6,0,.2,1); box-shadow:0 14px 50px rgba(0,0,0,.3); }
  #onb h3 { font-family:"Cormorant Garamond", serif; font-weight:500; font-size:26px; color:var(--gold2); margin-bottom:6px; }
  #onb p { font-size:15px; line-height:1.5; margin-bottom:14px; }
  .onb-row { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .onb-dots i { display:inline-block; width:7px; height:7px; border-radius:50%; background:rgba(255,255,255,.3); margin-right:5px; } .onb-dots i.on { background:var(--gold); }
  .onb-skip { background:none; border:0; color:#fff; opacity:.7; cursor:pointer; font:inherit; font-size:13px; margin-right:10px; }
  .onb-next[disabled] { opacity:.45; cursor:wait; }
  .spot.demo-hover .tip { opacity:1; transform:translate(-50%, 6px); } .spot.demo-hover i { transform:scale(1.25); box-shadow:0 0 0 10px rgba(212,176,106,.2), 0 0 26px rgba(212,176,106,.5); }
  #onb.show ~ #menu, body:has(#onb.show) #menu { z-index:11; }
  .onb-next { background:var(--gold); color:var(--g1); border:0; padding:9px 18px; border-radius:999px; cursor:pointer; font:inherit; font-size:14px; }
  #split-bar { position:fixed; z-index:9; top:10px; left:50%; transform:translateX(-50%); display:none; gap:6px; }
  body.site-split #split-bar { display:flex; }
  #split-bar button { width:34px; height:34px; border-radius:50%; border:1px solid rgba(212,176,106,.5); background:var(--glass); color:#fff; cursor:pointer; font:inherit; font-size:15px; backdrop-filter:blur(8px); box-shadow:0 4px 16px rgba(15,47,37,.35); }
  #split-bar button:hover { background:var(--gold); color:var(--g1); }
  .sec { padding:clamp(34px,5vw,64px) clamp(16px,4vw,56px); border-bottom:1px solid var(--line); scroll-margin-top:70px; }
  .sec h2 { font-family:"Cormorant Garamond", serif; font-size:clamp(30px,4vw,54px); line-height:1; font-weight:400; margin-bottom:8px; color:var(--g2); }
  .sec .k { font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--sea); margin-bottom:10px; }
  .sec p { max-width:64ch; font-size:15px; line-height:1.6; margin-bottom:10px; }
  .sec .world-link { display:inline-block; margin-top:10px; font-size:13px; color:var(--sea); text-decoration:none; border:1px solid var(--line); padding:7px 12px; border-radius:999px; cursor:pointer; background:none; font:inherit; }
  .note { font-size:12.5px; color:#7a5e2a; background:#f5e9cf; border-left:3px solid var(--accent); padding:8px 12px; border-radius:6px; max-width:64ch; margin-top:8px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:14px; margin-top:14px; }

  .grid small { color:var(--sea); }

  form.f button, .btn { background:var(--g2); color:#fff; border:0; padding:12px 20px; border-radius:999px; font:inherit; font-size:14px; cursor:pointer; }
  .out { background:#fff; border:1px dashed var(--line); padding:12px; border-radius:10px; font-size:13.5px; white-space:pre-wrap; margin-top:8px; display:none; }
  /* calendar */
  .cal { max-width:520px; margin-top:12px; background:#fff9ef; border:1px solid var(--line); border-radius:14px; padding:14px; }
  .cal-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; } .cal-head button { background:none; border:1px solid var(--line); border-radius:999px; padding:4px 10px; cursor:pointer; font:inherit; }
  .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; } .cal-grid span { font-size:11px; text-align:center; opacity:.6; padding:4px 0; }
  .cal-grid button { aspect-ratio:1; border:1px solid transparent; background:none; border-radius:8px; font:inherit; font-size:13px; cursor:pointer; color:var(--ink); }
  .cal-grid button:hover { border-color:var(--line); } .cal-grid button.in { background:#efe3c8; } .cal-grid button.edge { background:var(--g2); color:#fff; } .cal-grid button.past { opacity:.3; cursor:default; }
  .cal-sum { font-size:13.5px; margin-top:10px; }
  .comments article { background:#fff; border:1px solid var(--line); padding:12px 14px; border-radius:10px; margin-bottom:8px; font-size:14px; } .comments article b { display:block; font-size:12px; color:var(--sea); margin-bottom:4px; }
  .stars { color:var(--accent); letter-spacing:2px; }
  .gallery { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:10px; margin-top:12px; } .gallery img { width:100%; aspect-ratio:3/2; object-fit:cover; border-radius:10px; }
  .reception { margin-top:12px; border-top:1px solid rgba(212,176,106,.25); padding-top:12px; }
  .book-btn { width:100%; background:var(--gold); color:var(--g1); border:0; padding:10px 14px; border-radius:999px; font:inherit; font-size:13.5px; cursor:pointer; letter-spacing:.02em; }
  .book-form { display:grid; gap:7px; margin-top:10px; } .book-form b { color:var(--gold2); font-weight:500; font-size:13px; letter-spacing:.08em; text-transform:uppercase; } .book-form .room { font-size:13px; opacity:.85; }
  .book-form label { display:grid; gap:3px; font-size:11px; letter-spacing:.06em; text-transform:uppercase; opacity:.8; }
  .book-form input, .book-form select { font:inherit; font-size:13px; padding:7px 9px; border-radius:8px; border:1px solid rgba(212,176,106,.35); background:rgba(255,255,255,.08); color:#fff; color-scheme:dark; }
  .book-form button { background:var(--gold); color:var(--g1); border:0; padding:9px 12px; border-radius:999px; font:inherit; font-size:13px; cursor:pointer; }
  .book-out { font-size:12.5px; line-height:1.45; background:rgba(212,176,106,.15); border-radius:8px; padding:8px 10px; }
  .ledger { margin-top:22px; } .ledger h3 { font-family:"Cormorant Garamond", serif; font-weight:500; font-size:22px; margin-bottom:8px; }
  .tbl { overflow-x:auto; border:1px solid var(--line); border-radius:10px; background:#fff; } table { border-collapse:collapse; font-size:12.5px; min-width:640px; } th, td { padding:7px 10px; border-bottom:1px solid var(--line); text-align:left; white-space:nowrap; } th { background:#efe6d3; font-weight:500; }
  .btn.small { margin-top:8px; padding:8px 14px; font-size:12.5px; }
  footer { padding:30px clamp(16px,4vw,56px); font-size:12.5px; opacity:.7; display:flex; justify-content:space-between; flex-wrap:wrap; gap:12px; }
  @media (max-width:900px) { body.site-split #site { right:0; } body.site-split #top, body.site-split #card, body.site-split #title, body.site-split #deg { display:none; } }
</style>
